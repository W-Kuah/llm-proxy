# config.yaml
model_list:
  - model_name: claude-sonnet
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-5-20250929-v1:0
      aws_region_name: os.environ/AWS_REGION
  - model_name: kimi-k2.5
    litellm_params:
      model: bedrock/moonshotai.kimi-k2.5
      aws_region_name: os.environ/AWS_REGION
  - model_name: kimi-k2-thinking
    litellm_params:
      model: bedrock/moonshot.kimi-k2-thinking
      aws_region_name: os.environ/AWS_REGION
  - model_name: glm-5
    litellm_params:
      model: bedrock/zai.glm-5
      aws_region_name: os.environ/AWS_REGION
  - model_name: llama3.3-70b
    litellm_params:
      model: together_ai/meta-llama/Llama-3.3-70B-Instruct-Turbo
      api_key: os.environ/TOGETHER_API_KEY   # read from environment variable
  - model_name: kimi-k3
    litellm_params:
      model: together_ai/moonshotai/Kimi-K3
      api_key: os.environ/TOGETHER_API_KEY
      # LiteLLM only keeps tools/tool_choice for Together models flagged in its
      # model cost map; override so drop_params doesn't strip them.
      allowed_openai_params: ["tools", "tool_choice"]
      timeout: 180
  - model_name: deepseek-v4-pro
    litellm_params:
      model: together_ai/deepseek-ai/DeepSeek-V4-Pro-0813
      api_key: os.environ/TOGETHER_API_KEY
      allowed_openai_params: ["tools", "tool_choice"]
  - model_name: glm-5.2
    litellm_params:
      model: together_ai/zai-org/GLM-5.2
      api_key: os.environ/TOGETHER_API_KEY
      allowed_openai_params: ["tools", "tool_choice"]
      # GLM-5.2 thinks by default at reasoning_effort=max (deepest/slowest).
      # "high" is Together's recommendation for most coding/agentic work.
      reasoning_effort: "high"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # single shared key; per-user auth keys come in a later phase
  always_include_stream_usage: true           # stream usage in the final chunk so opencode can meter cost

litellm_settings:
  drop_params: true          # drop unsupported params from clients gracefully
  set_verbose: false         # keep logs clean
  # Safety net for the upstream LLM call: > CloudFront's 60s origin_read_timeout
  # (so it never self-inflicts a failure through the proxy) and < Lambda's 300s
  # timeout (so a hung provider aborts before the Lambda caps).
  request_timeout: 120
